<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>受注管理 ── 架空データの見本（板金工場）</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="b30band" style="position:sticky;top:0;z-index:99999;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 14px;background:#12121F;color:#fff;font:600 13px/1.6 'Noto Sans JP','Hiragino Sans',sans-serif;">
<a href="/#cases" style="display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:#fff;color:#12121F;text-decoration:none;font-weight:700;white-space:nowrap;">← アプリ一覧へ戻る</a>
<span style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;"><span style="opacity:.7;font-weight:500;">架空の会社のデータで動きます。実際のデータは使っていません。</span></span>
</div>

<header class="app">
  <div class="logo">受注<i>管理</i></div>
  <nav id="nav">
    <a href="#list" data-r="list">案件一覧</a>
    <a href="#assign" data-r="assign">⚙ 機械わりあて盤<small>次段階</small></a>
  </nav>
  <div class="hright"><span class="sample">架空データの見本</span><button class="reset" id="reset" type="button" title="触った内容を消して、最初の場面に戻します">最初に戻す</button></div>
</header>

<main class="wrap" id="main"></main>

<div class="sheetwrap" id="sheet" hidden>
  <div class="sheetbar">
    <b id="sheetTitle">帳票</b>
    <span class="muted" id="sheetNote"></span>
    <span class="grow"></span>
    <button type="button" class="btn main" id="doPrint">プリンターへ出す</button>
    <button type="button" class="btn sub" id="closeSheet">閉じる</button>
  </div>
  <div class="sheets" id="sheets"></div>
</div>

<div class="toast" id="toast"></div>

<noscript><p style="padding:20px">この見本はJavaScriptで動きます。</p></noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
